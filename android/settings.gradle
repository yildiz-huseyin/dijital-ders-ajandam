pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
        }
        def flutterSdkPathValue = properties.getProperty("flutter.sdk")
        if (flutterSdkPathValue == null) {
            flutterSdkPathValue = System.getenv("FLUTTER_ROOT")
        }
        assert flutterSdkPathValue != null, "flutter.sdk not set in local.properties and FLUTTER_ROOT env var not set"
        flutterSdkPathValue
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.9.23" apply false
}

include ":app"
